peerDependencyRules:
  # AI modified: the Vite+ core alias is versioned 0.3.3 while providing Vite 8 APIs.
  allowedVersions:
    vite: 0.3.3

shellEmulator: true

overrides:
  # AI modified: align the Vue runtime and compiler packages with the stable gvueter baseline.
  '@vue/compiler-core': 3.5.42
  '@vue/compiler-dom': 3.5.42
  '@vue/compiler-sfc': 3.5.42
  '@vue/compiler-ssr': 3.5.42
  '@vue/reactivity': 3.5.42
  '@vue/runtime-core': 3.5.42
  '@vue/runtime-dom': 3.5.42
  '@vue/server-renderer': 3.5.42
  '@vue/shared': 3.5.42
  # AI modified: pin patched transitive releases found by the full dependency audit.
  baseline-browser-mapping: 2.11.0
  body-parser: 1.20.6
  brace-expansion: 5.0.9
  browserslist: 4.28.9
  nanoid: 3.3.18
  postcss: 8.5.28
  qs: 6.16.0
  # AI modified: match Vite+ core and bundled Vitest without overriding catalog declarations.
  vite@*: 'catalog:'
  vitest@*: 4.1.11
  vue: 3.5.42

allowBuilds:
  esbuild: true
  # AI modified: vue-demi already ships Vue 3 entrypoints, so its postinstall switch is unnecessary.
  vue-demi: false

catalog:
  # AI modified: keep selected Vue, UI, and data capabilities on the gvueter baseline.
  '@lucide/vue': ^1.45.0
  '@playwright/test': 1.63.0
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/vue-query': ^5.102.8
  '@tanstack/vue-table': ^9.2.4
  '@tanstack/vue-virtual': ^3.13.38
  '@tsconfig/node24': ^24.0.5
  '@types/jsdom': ^30.0.0
  '@types/node': ^24.13.3
  '@unovis/ts': ^1.7.0
  '@unovis/vue': ^1.7.0
  '@vee-validate/zod': ^4.15.1
  '@vitejs/plugin-vue': ^6.0.8
  '@vue/tsconfig': ^0.9.1
  '@vueuse/core': ^14.4.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  https-localhost: ^4.7.2
  jsdom: ^30.0.1
  pinia: ^4.0.3
  reka-ui: ^2.10.4
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ~6.0.3
  vee-validate: ^4.15.1
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plugin-inspect: ^12.0.2
  # AI modified: prepare the optional PWA plugin without enabling a service worker yet.
  vite-plugin-pwa: 1.3.0
  vite-plugin-vue-devtools: ^8.2.1
  vite-plus: 0.3.3
  vue: 3.5.42
  vue-i18n: 11.4.10
  vue-router: ^5.3.1
  vue-tsc: ^3.3.11
  # AI modified: vee-validate's Zod adapter currently requires Zod 3.
  zod: 3.25.76
